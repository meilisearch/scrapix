# fly.toml app configuration file
app = "scrapix"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "30s"
  interval = "60s"
  method = "GET"
  timeout = "15s"
  path = "/health"

[vm]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048