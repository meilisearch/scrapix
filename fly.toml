app = "scrapix-server"
primary_region = "iad"

[build]
dockerfile = "apps/scraper/Dockerfile"

[[services]]
protocol = "tcp"
internal_port = 8080

[[services.ports]]
port = 80
handlers = ["http"]

[[services.ports]]
port = 443
handlers = ["tls", "http"]

[services.concurrency]
type = "requests"
hard_limit = 500
soft_limit = 400

[[services.tcp_checks]]
interval = "15s"
timeout = "10s"
grace_period = "5s"

[[services.http_checks]]
interval = "30s"
timeout = "10s"
grace_period = "5s"
method = "get"
path = "/health"
protocol = "http"

[env]
PORT = "8080"
NODE_ENV = "production"

# Auto-scaling configuration
[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 1
max_machines_running = 10

[http_service.concurrency]
type = "requests"
hard_limit = 500
soft_limit = 400

# Memory and CPU configuration
[vm]
cpu_kind = "shared"
cpus = 1
memory_mb = 1024

[deploy]
strategy = "rolling"